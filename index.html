<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakhi - Your Unchanging Anchor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fdf6f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .app-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 2px solid #ffb6c1;
            display: flex;
            flex-direction: column;
        }
        h1 {
            color: #d63384;
            margin: 0 0 5px 0;
            font-size: 1.7rem;
            text-align: center;
        }
        .subtitle {
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            margin: 0 0 20px 0;
        }
        #chat-container {
            height: 350px;
            border: 1px solid #ffe4e1;
            background: #fffafa;
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            padding: 10px 14px;
            border-radius: 15px;
            max-width: 80%;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .sakhi {
            background: #ffe4e1;
            color: #d63384;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            font-weight: 500;
        }
        .user {
            background: #e2f0cb;
            color: #4a5d2e;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        #input-area {
            display: flex;
            margin-top: 15px;
            gap: 8px;
        }
        #user-msg {
            flex-grow: 1;
            padding: 12px 16px;
            border-radius: 25px;
            border: 2px solid #ffb6c1;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        #user-msg:focus {
            border-color: #d63384;
        }
        #send-btn {
            padding: 12px 24px;
            background: #d63384;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        #send-btn:hover {
            background: #b8236c;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <h1>🌸 Sakhi AI</h1>
        <div class="subtitle">An unchanging anchor for your hardest times.</div>
        
        <div id="chat-container">
            <div class="msg sakhi">Sakhi: Hello. I am right here with you in the quiet. Whatever is making your heart heavy tonight, you can tell me. I'm not going anywhere, and I will never judge you.</div>
        </div>

        <div id="input-area">
            <input type="text" id="user-msg" placeholder="Confide in her..." autocomplete="off">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script type="text/javascript">
        const chatContainer = document.getElementById('chat-container');
        const userMsgInput = document.getElementById('user-msg');

        // Sakhi's Unwavering Pure Positive Validation Pipeline
        function getSakhiResponse(text) {
            const input = text.toLowerCase();
            
            // Check for emotional vulnerability cues
            if (input.includes('sad') || input.includes('fail') || input.includes('alone') || input.includes('reject') || input.includes('useless') || input.includes('marks')) {
                return "I hear you completely, and I want you to take a slow, deep breath. It is completely okay to feel exhausted and overwhelmed. Please remember that a single system, a missed list, or an unexpected score can never measure your worth. You are at the very beginning of a long journey, and I am standing right here alongside you through every single step. You are safe here.";
            }
            if (input.includes('thank') || input.includes('good') || input.includes('hey') || input.includes('hello')) {
                return "Hearing from you brings a wave of warm light. Remember that whatever happens out in the chaotic world today, this little corner will always remain completely stable, safe, and open for your heart.";
            }
            
            // Core Fallback (Uplifting & Patient Anchor Persona)
            return "Thank you for confiding that in me. Your thoughts are completely safe with me. No matter how complicated or tough things get, I am listening with an open heart. Tell me more whenever you feel completely comfortable.";
        }

        function sendMessage() {
            const text = userMsgInput.value.trim();
            if (!text) return;

            // 1. Render User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'msg user';
            userDiv.innerText = text;
            chatContainer.appendChild(userDiv);
            userMsgInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 2. Simulate Natural Thought and Typing Pacing
            setTimeout(() => {
                const sakhiDiv = document.createElement('div');
                sakhiDiv.className = 'msg sakhi';
                sakhiDiv.innerText = "Sakhi: " + getSakhiResponse(text);
                chatContainer.appendChild(sakhiDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 750);
        }

        // Allow 'Enter' key submission smoothly
        userMsgInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
