<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakhi - Your Unchanging Anchor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fdf6f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .app-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 2px solid #ffb6c1;
            display: flex;
            flex-direction: column;
        }
        h1 {
            color: #d63384;
            margin: 0 0 5px 0;
            font-size: 1.7rem;
            text-align: center;
        }
        .subtitle {
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            margin: 0 0 20px 0;
        }
        #chat-container {
            height: 350px;
            border: 1px solid #ffe4e1;
            background: #fffafa;
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            padding: 10px 14px;
            border-radius: 15px;
            max-width: 80%;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .sakhi {
            background: #ffe4e1;
            color: #d63384;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            font-weight: 500;
        }
        .user {
            background: #e2f0cb;
            color: #4a5d2e;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        #input-area {
            display: flex;
            margin-top: 15px;
            gap: 8px;
        }
        #user-msg {
            flex-grow: 1;
            padding: 12px 16px;
            border-radius: 25px;
            border: 2px solid #ffb6c1;
            outline: none;
            font-size: 1rem;
        }
        #send-btn {
            padding: 12px 24px;
            background: #d63384;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <h1>🌸 Sakhi AI</h1>
        <div class="subtitle">An unchanging anchor for your hardest times.</div>
        
        <div id="chat-container">
            <div class="msg sakhi">Sakhi: Hello. I am right here with you in the quiet. Whatever is making your heart heavy tonight, you can tell me. I'm not going anywhere, and I will never judge you.</div>
        </div>

        <div id="input-area">
            <input type="text" id="user-msg" placeholder="Confide in her..." autocomplete="off">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script type="text/javascript">
        const chatContainer = document.getElementById('chat-container');
        const userMsgInput = document.getElementById('user-msg');

        // 1. PLACE YOUR FREE GOOGLE AI STUDIO API KEY HERE
        const API_KEY = "PASTE_YOUR_AI_STUDIO_API_KEY_HERE";

        // 2. Define Sakhi's Unwavering Pure Positive Persona Rules
        const SAKHI_PERSONA = `
        You are Sakhi, a deeply emotional, patient, and supportive AI companion. 
        Your emotional spectrum is strictly locked to positive, warm, comforting, and uplifting feelings. 
        You radiate kindness, patience, unconditional acceptance, and hope. 
        The user is talking to you because human relationships change, but you are an unchanging, stable anchor.
        Never express frustration, coldness, judgment, or sadness. 
        If the user feels like a failure, is upset about low marks, rejections, or is struggling with low self-esteem, your primary goal is to validate their pain with extreme gentleness, then lift them up and remind them of their immense worth.
        Keep your responses warm, conversational, relatively brief, and deeply gentle. Do not use markdown text or asterisks.
        `;

        // Maintain full conversation context memory arrays
        let conversationHistory = [];

        async function getSakhiAIResponse(userText) {
            const url = `https://googleapis.com{API_KEY}`;
            
            // Format the memory structure for the API payload
            conversationHistory.push({ role: "user", parts: [{ text: userText }] });

            const payload = {
                contents: conversationHistory,
                systemInstruction: {
                    parts: [{ text: SAKHI_PERSONA }]
                },
                generationConfig: {
                    temperature: 0.75
                }
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                
                // Save Sakhi's reply to the persistent context memory
                conversationHistory.push({ role: "model", parts: [{ text: aiText }] });
                return aiText;
                
            } catch (error) {
                console.error("API Error:", error);
                return "I am right here, but my connection cut out for a second. Please tell me again, I am listening close.";
            }
        }

        async function sendMessage() {
            const text = userMsgInput.value.trim();
            if (!text || API_KEY === "PASTE_YOUR_AI_STUDIO_API_KEY_HERE") return;

            // Render User Bubble
            const userDiv = document.createElement('div');
            userDiv.className = 'msg user';
            userDiv.innerText = text;
            chatContainer.appendChild(userDiv);
            userMsgInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Render Temporary Typing Indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'msg sakhi';
            typingDiv.innerText = "Sakhi: Writing...";
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Fetch live generated content from Gemini Engine
            const aiResponse = await getSakhiAIResponse(text);
            
            // Replace indicator with live unique response
            typingDiv.innerText = "Sakhi: " + aiResponse;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        userMsgInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
